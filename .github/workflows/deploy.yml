name: Deploy yukchi prod

on:
  push:
    branches:
      - main

jobs:

  # ============================
  # PROD DEPLOY
  # ============================
  deploy_prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy PROD
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: |
          {
            printf 'VITE_BASE_URL=%s\n' "$VITE_BASE_URL"
            printf 'VITE_POSTHOG_PROJECT_TOKEN=%s\n' "$VITE_POSTHOG_PROJECT_TOKEN"
            printf 'VITE_POSTHOG_HOST=%s\n' "${VITE_POSTHOG_HOST:-https://us.i.posthog.com}"
          } | ssh -o StrictHostKeyChecking=no root@84.247.184.118 'cat > /tmp/yukchi-front.env'

          ssh -o StrictHostKeyChecking=no root@84.247.184.118 << 'EOF'
            cd /home/Projects/dev/yukchi-v2/yukchi-version-2.0
            git pull origin main
            set -a
            [ -f .env ] && . ./.env
            . /tmp/yukchi-front.env
            set +a
            docker compose -f docker-compose-prod.yml down
            docker compose -f docker-compose-prod.yml up -d --build
            rm -f /tmp/yukchi-front.env
            docker system prune -f
          EOF
